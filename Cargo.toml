[package]
name = "rust_tutorial"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1.10"
reqwest = { version = "0.11", features = ["json", "stream", "multipart", "rustls-tls"], default-features = false, optional = true }
axum = { version = "0.7", features = ["ws", "multipart"], optional = true }
tower-http = { version = "0.5", features = ["trace", "cors"], optional = true }
anyhow = "1.0"
thiserror = "1.0"
async-trait = "0.1"
futures-util = "0.3"
futures = "0.3"
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
tower = "0.4"

[features]
default = []
full = ["reqwest", "axum", "tower-http"]
