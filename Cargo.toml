[package]
name = "rust-py-example"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "A Rust library with Python bindings example"
license = "MIT"
repository = "https://github.com/yourusername/rust-py-example"
keywords = ["python", "rust", "pyo3"]
categories = ["api-bindings"]

# 用于发布到 crates.io 的 Rust 库
[lib]
name = "rust_py_example"
crate-type = ["cdylib", "rlib"]  # cdylib 用于 Python, rlib 用于 Rust

[dependencies]
# PyO3 用于 Python 绑定
pyo3 = { version = "0.20", features = ["extension-module"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = []
python = ["pyo3"]  # Python 绑定功能

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
