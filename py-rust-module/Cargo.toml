[package]
name = "py_rust_module"
version = "0.1.0"
edition = "2021"
description = "A Python module written in Rust using PyO3"
authors = ["Your Name <your.email@example.com>"]
license = "MIT"

[lib]
name = "py_rust_module"
# cdylib 是构建 Python 扩展模块所必需的
crate-type = ["cdylib"]

[dependencies]
# PyO3 是 Rust 和 Python 交互的核心库
pyo3 = { version = "0.23", features = ["extension-module"] }
# 用于序列化/反序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# 用于异步支持 (可选)
# pyo3-asyncio = { version = "0.20", features = ["tokio-runtime"] }
