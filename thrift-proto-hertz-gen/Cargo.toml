[package]
name = "thrift_proto_hertz_gen"
version = "0.1.0"
edition = "2021"
description = "Concurrent parser for .thrift and .proto files with Hertz HTTP server code generation"
authors = ["geekfun007"]

[dependencies]
# Async runtime for concurrent parsing
tokio = { version = "1.35", features = ["full"] }

# Parser combinator library
nom = "7.1"

# Command line argument parsing
clap = { version = "4.4", features = ["derive"] }

# Async recursion support
async-recursion = "1.0"

# For handling file paths
walkdir = "2.4"

# Git operations
git2 = "0.18"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Simple string formatting (no pest dependency)

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# URL parsing for git repos
url = "=2.4.1"

# HTTP client for fetching remote files
reqwest = { version = "0.11", features = ["blocking"] }

# Concurrent collections
dashmap = "5.5"

# Regex for parsing
regex = "1.10"

[[bin]]
name = "hertz-gen"
path = "src/main.rs"
